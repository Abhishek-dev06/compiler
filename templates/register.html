{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<p class="eyebrow">Save your runs</p>
<h1>Create account</h1>
{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" autofocus value="{{ request.form.get('username', '') }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
  <label for="password">Password <span class="auth-hint">(8+ characters)</span></label>
  <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
  <button type="submit" class="run-button auth-submit">Create account</button>
</form>
<p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a> · <a href="{{ url_for('compiler') }}">Continue as guest</a></p>
{% endblock %}
